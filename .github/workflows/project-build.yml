# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install project
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8
        pip install -r requirements.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
  test:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      python_version: "3.13"
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ env.python_version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.python_version }}
    - name: Install project
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Test simulator.py with multiple scenarios
      working-directory: src
      run: |
        # Fixtures (the repo's *test*.csv files are gitignored, so they are generated here)
        F="$RUNNER_TEMP/fixtures"; O="$RUNNER_TEMP/outputs"; mkdir -p "$F" "$O"
        printf 'Course,Price,End Date,Bundle\nA,3000,10/01/24,B1\nB,3500,10/03/24,B1\nC,8000,10/06/25,\n' > "$F/bundle.csv"
        printf 'Course,Price,End Date\nA,500,10/01/24\nB,700,10/06/24\n' > "$F/cheap.csv"
        printf 'Course,Price\nA,abc\n' > "$F/bad.csv"
        # Departure dates relative to the day of the run, on arbitrary days of the month (not only the 1st)
        DATES=(
          "$(date -d '-200 days' +%d/%m/%Y)"
          "$(date +%d/%m/%Y)"
          "$(date -d '+17 days' +%d/%m/%Y)"
          "$(date -d '+3 months +9 days' +%d/%m/%Y)"
          "$(date -d '+1 year +123 days' +%d/%m/%Y)"
        )
        FAR="$(date -d '+20 years' +%d/%m/%Y)"  # beyond the 15-year cap of any period of example.csv
        echo "Departure dates: ${DATES[*]} (far future: $FAR)"
        DEPS=(); for d in "${DATES[@]}"; do DEPS+=(--departure "$d"); done
        failures=0
        fail() { echo "::error title=simulator.py::$1"; failures=$((failures+1)); }
        # run_case <id> <expected exit code> <expected output (fixed string, may be empty)> <simulator args...>
        run_case() {
          local id="$1" code="$2" expect="$3"; shift 3
          echo "::group::$id"
          set +e; python simulator.py "$@" > "$O/$id.txt" 2>&1; rc=$?; set -e
          cat "$O/$id.txt"
          if [ "$rc" -ne "$code" ]; then fail "$id - exit code $rc (expected $code)"
          elif grep -q Traceback "$O/$id.txt"; then fail "$id - unexpected traceback"
          elif [ -n "$expect" ] && ! grep -qF -- "$expect" "$O/$id.txt"; then fail "$id - '$expect' not found in output"
          fi
          echo "::endgroup::"
        }
        totals() { sed -n 's/^TOTAL TO REIMBURSE : \([0-9.]*\)€$/\1/p' "$O/$1.txt"; }
        # check_totals <id> : one simulation per departure date, each with a non-negative total
        check_totals() {
          for d in "${DATES[@]}"; do grep -qF "SIMULATION - start at $d" "$O/$1.txt" || fail "$1 - no simulation for $d"; done
          [ "$(totals "$1" | wc -l)" -eq "${#DATES[@]}" ] || fail "$1 - expected ${#DATES[@]} totals"
          totals "$1" | awk '$1 < 0 { exit 1 }' || fail "$1 - negative total"
        }
        # compare <id1> <op> <id2> : totals of id1 vs id2, date by date
        compare() {
          paste <(totals "$1") <(totals "$3") | awk -v op="$2" '
            { ok = (op == "<=") ? $1 <= $2 + 0.005 : $1 >= $2 - 0.005 }
            !ok { print "  " $1 " " op " " $2 " does not hold"; bad = 1 } END { exit bad }' \
            || fail "$1 $2 $3 does not hold for every departure date"
        }
        # Nominal scenarios, each simulated at every departure date
        run_case base     0 "TOTAL TO REIMBURSE" example.csv "${DEPS[@]}" --timeline
        run_case cap      0 "TOTAL TO REIMBURSE" example.csv "${DEPS[@]}" --cap-years 1
        run_case min      0 "TOTAL TO REIMBURSE" example.csv "${DEPS[@]}" --min-rate 250
        run_case min100   0 "TOTAL TO REIMBURSE" example.csv "${DEPS[@]}" --min-rate 100
        run_case max      0 "TOTAL TO REIMBURSE" example.csv "${DEPS[@]}" --max-rate 150
        run_case minmax   0 "TOTAL TO REIMBURSE" example.csv "${DEPS[@]}" --min-rate 100 --max-rate 150 --timeline
        run_case postpone 0 "TOTAL TO REIMBURSE" example.csv "${DEPS[@]}" --min-rate 100 --max-rate 150 --postpone-remainder 400
        run_case bundle   0 "Bundle: B1 (A + B) - 6500.00€" "$F/bundle.csv" "${DEPS[@]}"
        run_case cheap    0 "TOTAL TO REIMBURSE" "$F/cheap.csv" "${DEPS[@]}"
        for id in base cap min min100 max minmax postpone bundle cheap; do check_totals "$id"; done
        # The timeline runs until the latest departure date
        LAST="$(date -d '+1 year +123 days' +%d/%m/%Y)"
        grep -qF "TIMELINE UNTIL $LAST" "$O/base.txt" || fail "base - no timeline until $LAST"
        # Properties that hold whatever the departure date
        compare cap      "<=" base      # the cap forgives what is left after it
        compare min      "<=" base      # a minimum rate pays off faster
        compare max      ">=" base      # a maximum rate pays off slower
        compare minmax   ">=" min100    # adding a maximum rate pays off slower
        compare postpone "<=" minmax    # merging the last month ends a period earlier
        totals cheap | awk '$1 != 0 { exit 1 }' || fail "cheap - courses below the threshold must cost nothing"
        # Default departure dates (1st of January of the next 4 years) and a far-future departure
        run_case default  0 "TOTAL TO REIMBURSE" example.csv
        [ "$(totals default | wc -l)" -eq 4 ] || fail "default - expected 4 totals"
        run_case far      0 "TOTAL TO REIMBURSE : 0.00€" example.csv --departure "$FAR"
        # Invalid inputs
        run_case max-le-min  2 "strictly greater than --min-rate" example.csv --min-rate 300 --max-rate 250
        run_case negative    2 "strictly positive" example.csv --min-rate -1
        run_case bad-date    2 "invalid parse_date value" example.csv --departure 31/02/2025
        run_case missing     1 "file not found" nonexistent.csv
        run_case malformed   1 "missing columns" "$F/bad.csv"
        if [ "$failures" -gt 0 ]; then echo "$failures check(s) failed"; exit 1; fi
    - name: Test dash_app.py starts with no error
      working-directory: src
      run: |
        python dash_app.py --local > dash.log 2>&1 &
        pid=$!
        trap 'kill $pid 2>/dev/null || true' EXIT
        for i in $(seq 1 30); do
          curl -fsS -o /dev/null http://127.0.0.1:8050/ 2>/dev/null && break
          if ! kill -0 $pid 2>/dev/null; then cat dash.log; echo "::error title=dash_app.py::app exited early"; exit 1; fi
          sleep 1
        done
        # The page itself, its layout and its callbacks must all be served
        curl -fsS -o /dev/null http://127.0.0.1:8050/
        curl -fsS http://127.0.0.1:8050/_dash-layout | grep -q '"props"'
        curl -fsS -o /dev/null http://127.0.0.1:8050/_dash-dependencies
        cat dash.log
        if grep -qE "Traceback|Error" dash.log; then echo "::error title=dash_app.py::errors in log"; exit 1; fi
